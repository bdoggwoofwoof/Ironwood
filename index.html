<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ironwood"><meta name="theme-color" content="#111315"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (pointer:coarse){body:has(input:focus:not([type=checkbox]):not([type=range]),textarea:focus) .tabs{display:none}}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
html{font-size:17px}
@supports (font: -apple-system-body) and (-webkit-touch-callout: none){html{font:-apple-system-body}}
:root{--tu:1;--u0:calc(clamp(.8px, 1rem / 17, 1.55px) * var(--tu));--u:var(--u0)}

</head><body>
<title>Ironwood</title>
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
/* Standalone: solid strip behind the iPhone status bar so content doesn't scroll under the clock */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:100;pointer-events:none}
</style>
<style>
/* Layout: one-column phone app. Sticky title bar, scrolling content, fixed tab bar. Dark-first like a gym-floor screen; competition-plate blue accent, yellow-plate PR badges. */
:root{
  color-scheme: dark;
  --bg:#111315; --surface:#1a1d21; --raised:#23272c; --line:#2d3238;
  --ink:#eef1f4; --ink-2:#a3abb4; --ink-3:#8e969f;
  --accent:#4c8dff; --accent-bg:#2f6fe0; --accent-ink:#ffffff; --accent-soft:rgba(76,141,255,.16);
  --pr:#ffcf40; --pr-ink:#1b1400; --stop:#f0603f; --good:#39c98a;
  --scrim:rgba(0,0,0,.55); --good-ink:#04210f; --stop-ink:#240800; --copy:#8b7cf6; --copy-ink:#140b36; --red-text:#ff7d61;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --gut:16px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f2f4f7; --surface:#ffffff; --raised:#e9edf2; --line:#d9dee5;
    --ink:#14171b; --ink-2:#59616b; --ink-3:#60686f;
    --accent:#1f5fd6; --accent-bg:#1f5fd6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,214,.10);
    --pr:#f5c22e; --pr-ink:#2a1e00; --stop:#b8381f; --good:#157a4d;
    --scrim:rgba(20,23,27,.35); --good-ink:#ffffff; --stop-ink:#ffffff; --copy:#6d5bd0; --copy-ink:#ffffff; --red-text:#b3341b;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f2f4f7; --surface:#ffffff; --raised:#e9edf2; --line:#d9dee5;
  --ink:#14171b; --ink-2:#59616b; --ink-3:#60686f;
  --accent:#1f5fd6; --accent-bg:#1f5fd6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,214,.10);
  --pr:#f5c22e; --pr-ink:#2a1e00; --stop:#b8381f; --good:#157a4d;
  --scrim:rgba(20,23,27,.35); --good-ink:#ffffff; --stop-ink:#ffffff; --copy:#6d5bd0; --copy-ink:#ffffff; --red-text:#b3341b;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111315; --surface:#1a1d21; --raised:#23272c; --line:#2d3238;
  --ink:#eef1f4; --ink-2:#a3abb4; --ink-3:#8e969f;
  --accent:#4c8dff; --accent-bg:#2f6fe0; --accent-ink:#ffffff; --accent-soft:rgba(76,141,255,.16);
  --pr:#ffcf40; --pr-ink:#1b1400; --stop:#f0603f; --good:#39c98a;
  --scrim:rgba(0,0,0,.55); --good-ink:#04210f; --stop-ink:#240800; --copy:#8b7cf6; --copy-ink:#140b36; --red-text:#ff7d61;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(16 * var(--u));line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.tab-nums{font-variant-numeric:tabular-nums}

/* Shell */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px var(--gut);max-width:640px;margin:0 auto;min-height:52px}
.hdr h1{font-family:var(--display);font-weight:700;font-size:calc(22 * var(--u));letter-spacing:.02em;text-transform:uppercase;text-align:center}
.hdr .l{justify-self:start}.hdr .r{justify-self:end}
.pill-btn{background:var(--raised);border-radius:999px;padding:7px 14px;font-weight:600;font-size:calc(15 * var(--u));display:inline-flex;align-items:center;gap:6px}
.pill-btn.accent{background:var(--accent-bg);color:var(--accent-ink)}
main{max-width:640px;margin:0 auto;padding-inline:var(--gut);padding-block:8px calc(var(--tabs-h,calc(66px + env(safe-area-inset-bottom,0px))) + 42px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink-3);font-size:calc(11.5 * var(--u));font-weight:600;letter-spacing:.02em;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .badge-dot{position:relative}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}

/* Type */
.eyebrow{font-size:calc(12 * var(--u));font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.section-h h2{font-family:var(--display);font-size:calc(20 * var(--u));font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.section-h .aside{font-size:calc(14 * var(--u));color:var(--ink-2)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:calc(14 * var(--u))}
p{margin:0}

/* Surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;font-size:calc(16 * var(--u));background:var(--raised);min-height:46px}
.btn.primary{background:var(--accent-bg);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.text{background:none;color:var(--accent);padding:8px 4px;min-height:44px}
.btn.danger{color:var(--stop)}
.btn.ghost{background:none;border:1.5px dashed var(--line);color:var(--ink-2)}
.btn:disabled{opacity:.45}
.btn svg,.pill-btn svg{width:18px;height:18px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{background:var(--raised)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:calc(12.5 * var(--u));font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--ink-2);white-space:nowrap}
.chip.group{background:var(--accent-soft);color:var(--accent)}
.chip.on{background:var(--accent-bg);color:var(--accent-ink)}
button.chip{min-height:30px;padding:4px 12px}
.tag{font-size:calc(11 * var(--u));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pr-badge{display:inline-flex;align-items:center;gap:5px;background:var(--pr);color:var(--pr-ink);font-weight:700;font-size:calc(12.5 * var(--u));padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap}
.pr-badge svg{width:14px;height:14px}
.empty{text-align:center;padding:36px 12px;color:var(--ink-2)}
.empty h3{font-family:var(--display);font-size:calc(22 * var(--u));text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.seg{display:inline-flex;background:var(--raised);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:calc(14 * var(--u));font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
input.field,select.field,textarea.field{width:100%;background:var(--raised);border:1.5px solid transparent;border-radius:10px;padding:11px 12px;font-size:calc(16 * var(--u))}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--accent);outline:none}
textarea.field{min-height:180px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:calc(16 * var(--u));line-height:1.5}
label.lbl{display:block;font-size:calc(13 * var(--u));font-weight:600;color:var(--ink-2);margin-bottom:6px}

/* Train home */
.today{margin-top:6px}
.next-card{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.next-card h2{font-family:var(--display);font-size:calc(30 * var(--u));line-height:1.02;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.next-list{display:flex;flex-direction:column;gap:4px;font-size:calc(15 * var(--u));color:var(--ink-2)}
.next-list .ssl{padding-left:14px;border-left:2px solid var(--accent-soft)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:calc(12 * var(--u));color:var(--ink-3);font-weight:600}
.wd i{width:100%;max-width:36px;aspect-ratio:1;border-radius:9px;background:var(--raised);display:grid;place-items:center;color:var(--accent-ink)}
.wd i svg{width:16px;height:16px}
.wd.hit i{background:var(--accent)}
.wd.is-today b{color:var(--ink)}
.wd.is-today i{box-shadow:0 0 0 1.5px var(--ink-3)}
.day-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.day-btn .t{font-weight:600}
.day-btn .s{font-size:calc(13.5 * var(--u));color:var(--ink-2)}
.day-btn .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:calc(15 * var(--u));white-space:nowrap}

/* Active workout */
.wo-head{display:flex;align-items:flex-end;gap:12px;margin:6px 0 10px}
.wo-title{font-family:var(--display);font-size:calc(30 * var(--u));font-weight:700;text-transform:uppercase;line-height:1.02}
.wo-clock{margin-left:auto;font-family:var(--display);font-size:calc(26 * var(--u));font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.slot{background:var(--surface);border-radius:var(--r);padding:14px 12px 8px;margin-top:12px;position:relative}
.slot.ss{margin-top:4px;border-top-left-radius:6px;border-top-right-radius:6px}
.slot.ss-next{border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.ss-tag{display:flex;align-items:center;gap:6px;font-size:calc(12 * var(--u));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:-4px 0 6px 2px}
.ss-tag svg{width:14px;height:14px}
.slot-head{display:flex;align-items:flex-start;gap:8px;padding-left:4px}
.slot-head h3{font-size:calc(18 * var(--u));font-weight:700;line-height:1.2}
.slot-head .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:calc(13.5 * var(--u));color:var(--ink-2)}
.slot-name{min-width:0;flex:1}
.hint{display:flex;align-items:center;gap:6px;font-size:calc(13.5 * var(--u));font-weight:600;margin:8px 4px 0;color:var(--good)}
.hint svg{width:15px;height:15px}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.set-row{display:grid;grid-template-columns:30px 78px 60px minmax(0,1fr);gap:8px;align-items:center;padding:4px;border-radius:10px;background:var(--surface);touch-action:pan-y;position:relative;z-index:1}
.set-row.th{font-size:calc(11.5 * var(--u));font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-block:0}
.set-row.th span:nth-child(3),.set-row.th span:nth-child(4){text-align:center}
.set-row .n{font-family:var(--display);font-weight:700;font-size:calc(18 * var(--u));text-align:center;color:var(--ink-2)}
.set-row .prev{font-size:calc(14 * var(--u));color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row input{width:100%;text-align:center;background:var(--raised);border:1.5px solid transparent;border-radius:9px;padding:9px 4px;font-size:calc(17 * var(--u));font-weight:600;font-variant-numeric:tabular-nums}
.set-row input:focus{border-color:var(--accent);outline:none}
.set-row input::placeholder{color:var(--ink-3);opacity:1;font-weight:500}
.set-row input:focus::placeholder{color:var(--ink-3);opacity:.6}
.set-row.done{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
.set-row.done input{background:transparent}
.chk{width:44px;height:40px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--ink-3)}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--accent-bg);color:var(--accent-ink)}
.slot-foot{display:flex;align-items:center;gap:14px;padding:2px 4px 0;flex-wrap:wrap}
.plates{margin-left:auto;font-size:calc(13 * var(--u));color:var(--ink-3);font-variant-numeric:tabular-nums}
.restbar{position:fixed;left:0;right:0;bottom:var(--tabs-h,calc(66px + env(safe-area-inset-bottom,0px)));z-index:29;padding:0 var(--gut) 8px}
.restbar-in{max-width:608px;margin:0 auto;background:var(--accent-bg);color:var(--accent-ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.restbar .t{font-family:var(--display);font-size:calc(26 * var(--u));font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.restbar button{background:rgba(255,255,255,.18);border-radius:9px;padding:7px 10px;font-weight:700;font-size:calc(14 * var(--u));min-height:44px;min-width:44px}
.restbar .lbl2{font-size:calc(13 * var(--u));font-weight:600;opacity:.85}
.restbar-in{flex-wrap:wrap}
.restbar .rest-save{flex-basis:100%;text-align:left;background:none;padding:2px 0 0;font-size:calc(14 * var(--u));font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Log */
.month-h{font-family:var(--display);font-size:calc(18 * var(--u));font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin:22px 0 8px}
.log-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;text-align:left;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.date-chip{background:var(--raised);border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px 0;align-self:start}
.date-chip span{font-size:calc(12 * var(--u));font-weight:600;color:var(--ink-2)}
.date-chip b{font-family:var(--display);font-size:calc(26 * var(--u));line-height:1;font-weight:700}
.log-top{display:flex;align-items:baseline;gap:10px}
.log-top h3{font-size:calc(17.5 * var(--u));font-weight:700;line-height:1.25;flex:1;min-width:0}
.log-top .mins{font-size:calc(14 * var(--u));color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.log-ex{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:calc(15 * var(--u))}
.log-ex li{display:flex;gap:10px;justify-content:space-between}
.log-ex li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-ex .best{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.log-prs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.log-act{margin-top:6px;font-size:calc(15 * var(--u));color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Routines */
.r-card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:16px}
.r-card h3{font-family:var(--display);font-size:calc(22 * var(--u));font-weight:700;text-transform:uppercase;line-height:1.05}
.r-card .days{font-size:calc(14 * var(--u));color:var(--ink-2)}
.hdr-space{height:calc(env(safe-area-inset-top,0px) + 14px)}
/* Oct 21 */
.last-line{font-size:calc(13.5 * var(--u));color:var(--ink-2);margin-top:4px;line-height:1.35}
.hint.prog-step,.hint.prog-deload{color:var(--ink-2)}
.run-missed{background:var(--raised);color:var(--red-text)}
.care-red .lbl{color:var(--red-text)}
.care-finder .chip{font-size:calc(14 * var(--u));padding:8px 12px;min-height:36px}
.also-card{background:var(--surface);border-radius:var(--r);padding:14px}
.also-h{display:flex;align-items:center;gap:8px}.also-h .eyebrow{flex:1}
.also-t{font-weight:700;font-size:calc(18 * var(--u));margin-top:2px}
.also-s{font-size:calc(14 * var(--u));color:var(--ink-2);margin-top:2px;line-height:1.35}
.wo-addons{margin-bottom:6px}
.topsw.four{gap:14px;overflow-x:auto;scrollbar-width:none}.topsw.four::-webkit-scrollbar{display:none}
.topsw.four button{font-size:calc(24 * var(--u));white-space:nowrap;flex:none}
.meas-row.k-timed.nol{grid-template-columns:30px minmax(0,1fr) 46px}.meas-row.nol>:nth-child(3){display:none}
.fc-now b{font-size:calc(17 * var(--u))}.fc-toggles{padding-top:4px;padding-bottom:4px}.fc-toggles .toggle-row{padding:8px 0;border-bottom:1px solid var(--line)}.fc-toggles .toggle-row:last-child{border-bottom:0}
.fc-presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc-preset{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px;min-height:64px;gap:2px}
.fc-preset b{font-size:calc(16 * var(--u))}.fc-preset span{font-size:calc(13 * var(--u));color:var(--ink-2)}
.fc-call{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:6px;transition:transform .15s}
.fc-call b{font-family:var(--display);font-size:calc(38 * var(--u));font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}

.topsw button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tip-card{display:flex;align-items:flex-start;gap:6px;background:var(--surface);border-radius:12px;padding:10px 6px 10px 14px;font-size:calc(14 * var(--u));color:var(--ink-2);line-height:1.4}
.tip-x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none;margin-top:-5px}
.tip-x svg{width:16px;height:16px}
.help-foot{display:flex;justify-content:center;margin:28px 0 4px}
.help-q{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:calc(12 * var(--u));font-weight:700;line-height:1}
.sync-line{margin:10px 0 0;font-size:calc(13.5 * var(--u))}
.pal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--raised);border-radius:12px;padding:10px 12px;text-align:left;border:2px solid transparent}
.pal.on{border-color:var(--ink)}
.pal .sw{display:flex;gap:4px}.pal .sw i{width:18px;height:18px;border-radius:50%;display:block}
.pal .pn{font-weight:600;font-size:calc(14.5 * var(--u))}.pal .pd{font-size:calc(12 * var(--u));color:var(--ink-2);line-height:1.3}
/* Custom colors sheet */
.slot-pick{display:grid;gap:6px;margin-bottom:12px}
.slot-btn{display:flex;align-items:center;gap:12px;background:var(--raised);border-radius:12px;padding:8px 12px;text-align:left;border:2px solid transparent;min-height:48px}
.slot-btn.on{border-color:var(--ink)}
.slot-btn i{width:26px;height:26px;border-radius:50%;flex:none;display:block;border:2px solid rgba(255,255,255,.18)}
.slot-btn>span{display:flex;flex-direction:column;line-height:1.25}.slot-btn b{font-weight:600;font-size:calc(15 * var(--u))}.slot-btn .d{font-size:calc(12 * var(--u));color:var(--ink-2)}
.wheel{position:relative;margin:4px auto 0;touch-action:none;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.wheel canvas,.wheel svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.wheel .wl{stroke-width:2;stroke-linecap:round}
.wheel .wl.main{stroke:rgba(255,255,255,.9)}
.wheel .wl.sug{stroke:rgba(255,255,255,.75);stroke-dasharray:4 5}
.wheel .wc{fill:rgba(255,255,255,.9)}
.wheel .wd-sug{stroke:#fff;stroke-width:2}
.wheel .wd-main{stroke:#fff;stroke-width:3;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.wheel .wl,.wheel .wc{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.sug-sw{width:44px;height:44px;border-radius:50%;flex:none;border:2px solid var(--line)}
.cw-v{width:100%;margin-top:6px;accent-color:var(--accent)}
.cw-prev{display:flex;gap:10px;align-items:center;margin-top:14px}
.cw-prev .btn{pointer-events:none}
.fb-details{white-space:pre-wrap;word-break:break-word;font-size:calc(12 * var(--u));background:var(--raised);border-radius:10px;padding:10px;color:var(--ink-2);margin:0;max-height:140px;overflow:auto}
a.btn{text-decoration:none;color:var(--accent)}a.btn.primary{color:var(--accent-ink)}a.btn.disabled{opacity:.45;pointer-events:none}
.tour{position:fixed;inset:0;z-index:90}
.tour-inset{position:fixed;left:0;width:0;top:env(safe-area-inset-top,0px);height:env(safe-area-inset-bottom,0px);pointer-events:none}
.tour-hole{position:fixed;inset:0;pointer-events:none}
.tour-dim{position:absolute;inset:0;width:100%;height:100%;display:block}
body.tour-on .hdr,body.tour-on .tabs{backdrop-filter:none;-webkit-backdrop-filter:none}
.tour-card{position:fixed;left:12px;right:12px;top:0;max-width:560px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 36px rgba(0,0,0,.4);opacity:0;will-change:transform,opacity}
.tour-txt{animation:tourfade .25s ease}
@keyframes tourfade{from{opacity:0;transform:translateY(4px)}}
.tour-card h2{font-family:var(--display);font-size:calc(24 * var(--u));font-weight:700;text-transform:uppercase;line-height:1.05;margin-top:4px}
body.tour-on main,body.tour-on .hdr,body.tour-on .hdr-space{transition:opacity .2s ease}
body.tour-fading main,body.tour-fading .hdr,body.tour-fading .hdr-space{opacity:0}
.tour-ring{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;box-shadow:0 0 0 3px var(--accent);opacity:0;will-change:transform}
:root.rm .tour-txt{animation:tourfadeonly .25s ease}
@keyframes tourfadeonly{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.tour-txt{animation:tourfadeonly .25s ease}}
.tag-row{display:flex;flex-wrap:wrap;gap:4px}
.chip.wtag{font-size:calc(11.5 * var(--u));padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.wsec-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 4px 10px;border-bottom:1px solid var(--line);text-align:left}
.wsec-h h2{font-family:var(--display);font-size:calc(20 * var(--u));font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex:1}
.wsec-h svg{width:18px;height:18px;color:var(--ink-2)}
.wk-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px}
.wk-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.wk-main .t{font-weight:700;line-height:1.25}
.wk-main .s{font-size:calc(13.5 * var(--u));color:var(--ink-2)}
.r-items li{gap:2px 8px}
.r-items .nm{font-weight:600}
.r-items .sub{flex-basis:100%;font-size:calc(13.5 * var(--u));color:var(--ink-2)}
.r-items .cue{flex-basis:100%;font-size:calc(13.5 * var(--u));color:var(--ink-3)}
.ed-tags{display:flex;flex-wrap:wrap;gap:6px}
input.field.ed-cue{padding:8px 10px;font-size:calc(16 * var(--u));background:var(--surface)}
.r-day{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.r-day h3{font-size:calc(17 * var(--u));font-weight:700}
.r-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:calc(15 * var(--u))}
.r-items li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-items li.ssi{padding-left:12px;border-left:2px solid var(--accent)}
.r-items .sx{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:30px}
.ed-item{background:var(--raised);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-item.ssi{border-left:3px solid var(--accent)}
.ed-name{font-weight:600;text-align:left;display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.ed-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-name svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border-radius:9px}
.stepper button{width:34px;height:34px;font-size:calc(20 * var(--u));font-weight:600;color:var(--accent)}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.ed-reps{width:84px;background:var(--surface);border:1.5px solid transparent;border-radius:9px;padding:6px 8px;font-size:calc(16 * var(--u));text-align:center}
.ed-reps:focus{border-color:var(--accent);outline:none}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:calc(13.5 * var(--u));font-weight:600;color:var(--ink-2)}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:calc(32 * var(--u));font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:calc(12.5 * var(--u));color:var(--ink-2);font-weight:600}
.heat{display:grid;grid-template-columns:18px repeat(16,minmax(0,1fr));grid-template-rows:auto repeat(7,minmax(0,1fr));gap:3px;align-items:center}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--raised);display:block}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.now{box-shadow:0 0 0 1.5px var(--ink-2)}
.heat .dl{font-size:calc(10 * var(--u));color:var(--ink-3);font-weight:600}
.heat .ml{font-size:calc(10 * var(--u));color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:visible}
.lift-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 64px;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.lift-row .nm{font-weight:600;line-height:1.25}
.lift-row .sub{font-size:calc(13 * var(--u));color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.lift-row .v{text-align:right;font-variant-numeric:tabular-nums}
.lift-row .v b{display:block;font-size:calc(17 * var(--u))}
.lift-row .v span{font-size:calc(12 * var(--u))}
.up-c{color:var(--good)}.down-c{color:var(--stop)}
.chart-wrap{position:relative;margin-top:8px}
.chart-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(13 * var(--u));color:var(--ink-2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:22px;height:8px}
.tip{position:absolute;top:4px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:calc(12.5 * var(--u));line-height:1.3;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{font-size:calc(14 * var(--u))}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.trio>div{background:var(--raised);border-radius:12px;padding:10px}
.trio b{display:block;font-family:var(--display);font-size:calc(24 * var(--u));line-height:1.05;font-variant-numeric:tabular-nums}
.trio span{font-size:calc(12 * var(--u));color:var(--ink-2);font-weight:600;line-height:1.25;display:block}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:calc(14.5 * var(--u));font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:calc(11.5 * var(--u));letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:6px 8px 6px 0}
.tbl td{padding:8px 8px 8px 0;border-top:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right;padding-right:0}
.demo-banner{display:flex;gap:8px;align-items:center;font-size:calc(13.5 * var(--u));font-weight:600;color:var(--ink-2);background:var(--raised);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.prl{display:flex;flex-direction:column;gap:8px}
.prl>div{display:flex;align-items:center;gap:10px;justify-content:space-between}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{overscroll-behavior:contain;background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px var(--gut) calc(20px + env(safe-area-inset-bottom,0px));animation:rise .2s ease}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.grab-zone{display:block;width:100%;margin:-8px 0 0;padding:8px 0 2px;background:none;touch-action:none;cursor:grab}
.grab-zone:active{cursor:grabbing}.grab-zone:active .grab{background:var(--ink-3)}
.sheet.big{max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);height:calc(100% - env(safe-area-inset-top,0px) - 12px)}
.sheet h2:focus,.sheet:focus{outline:none}
.sheet h2{font-family:var(--display);font-size:calc(24 * var(--u));font-weight:700;text-transform:uppercase;line-height:1.05;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:calc(16 * var(--u));font-weight:500}
.opt svg{width:20px;height:20px;color:var(--ink-2)}
.opt .d{font-size:calc(13.5 * var(--u));color:var(--ink-2);font-weight:400}
.opt.on{color:var(--accent)}
.pick-list{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;margin-top:8px;overscroll-behavior:contain}
.pick-list .opt{padding:11px 4px}
/* set rows: swipe right to log, left to delete */
.set-row.th{background:none;touch-action:auto}
.set-row input.note{text-align:left;font-size:calc(16 * var(--u));font-weight:500;padding:9px 10px}
.set-row .n.pr{background:var(--pr);color:var(--pr-ink);border-radius:8px;padding:3px 0}
.swipe{position:relative;border-radius:10px;overflow:hidden}
.step-strip{display:flex;align-items:center;gap:8px;padding:6px 0 4px;animation:fadein .12s ease}
.step-strip button{min-height:44px;min-width:66px;padding:0 12px;border-radius:10px;background:var(--raised);color:var(--accent);font-weight:700;font-size:calc(17 * var(--u));font-variant-numeric:tabular-nums;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.step-strip .step-last{min-width:0;font-size:calc(14 * var(--u));color:var(--ink-2)}
.step-val{flex:1;text-align:center;font-weight:600;font-size:calc(15 * var(--u));color:var(--ink-2)}
:root.rm .step-strip{animation:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.swipe .under{position:absolute;inset:0;background:var(--bg);border-radius:10px}
.under .ul,.under .ur{position:absolute;top:0;bottom:0;width:0;display:flex;align-items:stretch;overflow:hidden}
.under .ul{left:0}.under .ur{right:0}
.act{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;overflow:hidden;transition:flex-grow .16s ease,opacity .16s ease,padding .16s ease}
.act .pill{width:100%;max-width:74px;height:32px;border-radius:999px;display:grid;place-items:center;transition:max-width .16s ease}
.act .pill svg{width:18px;height:18px}
.act .al{font-size:calc(11 * var(--u));font-weight:600;color:var(--ink-2);white-space:nowrap}
.act.ok .pill{background:var(--good);color:var(--good-ink)}
.act.cp .pill{background:var(--copy);color:var(--copy-ink)}
.act.del .pill{background:var(--stop);color:var(--stop-ink)}
.ul.full .act.cp{flex-grow:0;opacity:0;padding:0}
.ul.full .act.ok .pill,.ur.full .act.del .pill{max-width:none}
.note-add{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-3);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.note-add svg{width:17px;height:17px}
.note-add.wide{width:auto;padding:0 12px;display:inline-flex;gap:6px;align-items:center;font-size:calc(13.5 * var(--u));font-weight:600;color:var(--ink-2)}
.note-txt{min-height:40px;display:flex;align-items:center;padding:0 10px;font-size:calc(16 * var(--u));font-weight:700;color:var(--ink);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;width:100%}
.ex-note-row{display:flex;align-items:center;gap:10px;margin:10px 0 2px;min-width:0}
.ex-prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ex-note-txt{display:block;width:100%;text-align:left;margin:10px 0 2px;padding:9px 4px;font-size:calc(16 * var(--u));font-weight:700;color:var(--ink);border-radius:9px}
.unit-tog{font-size:calc(11.5 * var(--u));font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);text-align:center;min-height:28px;border-radius:6px;position:relative}
/* Small controls keep their size but answer to a 44px touch area */
.unit-tog::after,button.chip::after,.icon-btn::after,.note-add::after,.stepper button::after,.tip-x::after{content:'';position:absolute;inset:-7px}
button.chip,.icon-btn,.note-add,.stepper button,.tip-x{position:relative}
.ex-note{width:100%;margin:10px 0 2px;background:var(--raised);border:1.5px solid transparent;border-radius:9px;padding:9px 10px;font-size:calc(16 * var(--u))}
.ex-note:focus{border-color:var(--accent);outline:none}
.ex-note::placeholder,.set-row input.note::placeholder,.edit-set input.note::placeholder{color:var(--ink-3);opacity:1}
.swipe-hint{font-size:calc(13.5 * var(--u));color:var(--ink-2);background:var(--raised);border-radius:10px;padding:8px 10px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:70;display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;font-weight:700;font-size:calc(14.5 * var(--u));line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .15s ease}
.toast.pr{background:var(--pr);color:var(--pr-ink)}
.toast.info{background:var(--ink);color:var(--bg)}
.toast.bad{background:var(--stop);color:#fff}
.toast svg{width:18px;height:18px;flex:none}
.toast button{text-decoration:underline;text-underline-offset:3px;font-weight:700;margin-left:6px;color:inherit;white-space:nowrap}
.restbar .rest-time{background:none;padding:0;text-align:left;border-radius:0}
.mini{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:19;width:min(608px,calc(100% - 32px));display:flex;gap:8px;align-items:center;background:var(--raised);border-radius:12px;padding:6px 6px 6px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mini-open{flex:1;display:flex;align-items:baseline;gap:10px;text-align:left;min-width:0}
.mini-open b{font-family:var(--display);font-size:calc(22 * var(--u));font-variant-numeric:tabular-nums}
.mini-open span{font-size:calc(13.5 * var(--u));color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{background:var(--accent-bg);color:var(--accent-ink);border-radius:9px;padding:8px 12px;font-weight:700;font-size:calc(14 * var(--u))}
main.with-mini{padding-top:64px}
.wd{background:none;border:0;padding:0}
.wd .mk{font-size:calc(12 * var(--u));font-weight:700;color:var(--ink-2)}
.wd.mk-ex i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.wd.mk-rest i{background:repeating-linear-gradient(45deg,var(--raised) 0 3px,var(--line) 3px 6px)}
.heat i.ex{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.heat i.rest{background:repeating-linear-gradient(45deg,var(--raised) 0 2px,var(--line) 2px 4px)}
.heat-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:calc(12.5 * var(--u));color:var(--ink-2)}
.heat-legend span{display:inline-flex;align-items:center;gap:6px}
.heat-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--raised)}
.heat-legend i.on,.heat-legend i.cc-done{background:var(--accent)}
.heat-legend i.ex,.heat-legend i.cc-paused{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.heat-legend i.rest{background:repeating-linear-gradient(45deg,var(--raised) 0 2px,var(--line) 2px 4px)}
.heat-legend i.cc-rest{background:var(--good)}
.heat-legend i.cc-missed{background:var(--stop)}
/* challenges */
.ch-card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ch-card h3{font-family:var(--display);font-size:calc(22 * var(--u));font-weight:700;text-transform:uppercase;line-height:1.05}
.ch-list{display:flex;flex-direction:column;gap:6px}
.ch-item{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 10px;border-radius:10px;background:var(--raised);text-align:left;width:100%}
.ch-item i{width:26px;height:26px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--ink-3);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.ch-item i svg{width:16px;height:16px}
.ch-item.on i{background:var(--accent);box-shadow:none}
.ch-item .nm{font-weight:600;white-space:nowrap}

<script>
/* Standalone build: there is no Claude page around the app here. Saving files (backups, photos,
   phrase lists) goes through the iPhone share sheet; everything else is reported as unavailable,
   so workouts stay on this phone and translation falls back to the spreadsheet upload. */
(function () {
  if (window.claude) return;
  const declined = () => { const e = new Error('declined'); e.code = 'declined'; return e; };
  async function save({ filename, data }) {
    const type = typeof data === 'string' ? (/\.csv$/i.test(filename) ? 'text/csv' : 'application/json') : (data.type || 'application/octet-stream');
    const file = new File([data], filename, { type });
    if (navigator.canShare && navigator.share) {
      let ok = false; try { ok = navigator.canShare({ files: [file] }); } catch (e) {}
      if (ok) {
        try { await navigator.share({ files: [file] }); return; }
        catch (e) { if (e && e.name === 'AbortError') throw declined(); }
      }
    }
    const url = URL.createObjectURL(file); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  window.claude = { standalone: true, use: async name => name === 'downloads' ? { save } : null };
})();
</script>

/* ============ Core logic (no DOM) ============ */
const DAY = 864e5;

const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => { if (n == null || !isFinite(n)) return '–'; const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const nameKey = s => norm(s).replace(/ /g, '').replace(/(es|s)$/, '');
const slug = s => norm(s).replace(/ /g, '-').slice(0, 40) || 'ex';
const titleCase = s => { s = s.replace(/\s+/g, ' ').trim(); if (/[A-Z]/.test(s.slice(1)) && /[a-z]/.test(s)) { if (!/[a-z][A-Z]/.test(s)) return s; } return s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()); };
const epley = (w, r) => r <= 0 ? 0 : r === 1 ? w : w * (1 + Math.min(r, 15) / 30);

const KINDS = { barbell: 'Barbell', dumbbell: 'Dumbbell', cable: 'Cable', machine: 'Machine', bodyweight: 'Bodyweight', assisted: 'Assisted', other: 'Other' };
function guessKind(name) {
  const n = norm(name);
  if (/assist/.test(n)) return 'assisted';
  if (/\b(run|running|jog|jogging|sprints?|swim|swimming|cycling|elliptical|rowing machine|erg|treadmill)\b/.test(n)) return 'distance';
  if (/\b(carry|carries|ruck|rucking|sled push|sled drag|yoke)\b/.test(n)) return 'carry';
  if (/\b(plank|dead hang|wall sit|l-sit|hollow hold)\b/.test(n) && !/jack|up|walk|row/.test(n)) return 'timed';
  if (/machine|leg curl|leg press|leg extension|calf|chest press|smith|hack/.test(n)) return 'machine';
  if (/barbell|squat|deadlift|bench|\brdl\b|romanian|good morning|hip thrust/.test(n)) return 'barbell';
  if (/cable|pulldown|pushdown|push down|face pull|crunch|\bfl(y|ies)\b/.test(n)) return 'cable';
  if (/dumbbell|\bdb\b|curl|cuban|shrug|lateral|raise/.test(n)) return 'dumbbell';
  if (/pull ?up|chin ?up|\bdips?\b|push ?up|plank/.test(n)) return 'bodyweight';
  return 'other';

/* Program text parser: accepts RepCount-style ("3x x Hybrid Curls"), "4x8-10 Squat", "Squat 3x5",
   "Bench - 3 sets x 8 reps", A1/A2 supersets, and plain headers as day names. */
function parseProgram(text) {
  const days = []; let cur = null, lastLetter = null;
  const newDay = name => { cur = { name: name.replace(/[:\s]+$/, '').trim() || ('Day ' + (days.length + 1)), items: [] }; days.push(cur); lastLetter = null; };
  const add = (name, sets, reps, ss) => {
    if (!cur) newDay('Day 1');
    name = String(name).replace(/\s+/g, ' ').trim(); if (!name) return;
    cur.items.push({ name, sets: Math.min(Math.max(sets || 3, 1), 20), reps: String(reps || '').replace(/\s/g, '').replace('–', '-'), ss: !!ss && cur.items.length > 0 });
  };
  for (const raw of String(text || '').split(/\r?\n/)) {
    let line = raw.replace(/^\s*[-•*·]\s+/, '').trim();
    if (!line) continue;
    let ss = false, letter = null;
    const ab = line.match(/^([A-Za-z])(\d)[.):]\s+(.*)$/);
    if (ab) { letter = ab[1].toUpperCase(); ss = letter === lastLetter; line = ab[3]; }
    let m = line.match(/^(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?)?\s+((?:x|ss|\+)\s+)?(.+)$/i);
    if (m) { add(m[4], +m[1], m[2], ss || !!m[3]); lastLetter = letter; continue; }
    m = line.match(/^((?:x|ss|\+)\s+)?(.+?)\s*[:–—-]?\s+(\d+)\s*(?:sets?\s*)?[x×]\s*(\d+(?:\s*[-–]\s*\d+)?)\s*(?:reps?)?$/i);
    if (m) { add(m[2], +m[3], m[4], ss || !!m[1]); lastLetter = letter; continue; }
    m = line.match(/^(?:x|ss|\+)\s+(.+)$/i);
    if (m && cur) { add(m[1], 3, '', true); continue; }
    if (letter) { add(line, 3, '', ss); lastLetter = letter; continue; }
    newDay(line);
  }
  return days.filter(d => d.items.length);
}

}

      ${ticks.map(v => html`<g key=${v}><line x1=${L} x2=${W - R} y1=${y(v)} y2=${y(v)} stroke="var(--line)" stroke-width="1"/><text x=${L - 6} y=${y(v) + 4} text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text></g>`)}

function switchMainUnit(u) {

  commit(x => {
    for (const [id, s] of Object.entries(x.sessions)) { let hit = false; for (const it of s.items || []) if (!it.u) { it.u = from; hit = true; } if (hit) { s.updatedAt = Date.now(); keys.push('s_' + id); } }

/* ============ Oct 21 review improvements ============ */
/* ---- Progression: weight jump per exercise, smaller jumps after a miss, a drop after three misses ----
   settings.fine: the smallest weight you can add (5 / 2.5 / 1 lb, 2.5 / 1.25 / 0.5 kg).
   settings.stepDown: after a jump, if a set falls below the bottom of the rep range, the next suggestion is half the jump.
   settings.deload: after three sessions short at one weight, suggest about 10% less.

const FINE_OPTS = { lb: [5, 2.5, 1], kg: [2.5, 1, 0.5] };

/* The biggest jump by default: 20 lb (10 each side) or 10 kg. Bigger jumps miss more often than they save time.

const maxJump = u => S.meta.settings.bigJumps ? (u === 'kg' ? 225 : 500) : (u === 'kg' ? 10 : 20);
const jumpPresets = u => JUMP_PRESETS[u].concat(S.meta.settings.bigJumps ? BIG_PRESETS[u] : []);
const unitInc = u => u === U() ? +S.meta.settings.inc || UNIT_DEFAULTS[u].inc : UNIT_DEFAULTS[u].inc;
function fineFor(u) {

  const v = conv(f, st.unit, u); return FINE_OPTS[u].reduce((b, o) => Math.abs(o - v) < Math.abs(b - v) ? o : b, FINE_OPTS[u][0]);
}
const isDeadlift = ex => /deadlift/.test(norm(exName(ex))) && !/romanian|stiff|dumbbell|single|kettlebell/.test(norm(exName(ex)));
/* The jump for one exercise in unit u: its own setting, else the main jump (twice that on barbell deadlifts) */
function jumpDefault(ex, u) { const b = unitInc(u); return exKind(ex) === 'barbell' && isDeadlift(ex) ? b * 2 : b; }
function jumpFor(ex, u) {

}
const repBottom = reps => { const m = String(reps || '').match(/^(\d+)/); return m ? +m[1] : 0; };
/* The last n entries for an exercise at this slot position (newest first), weights in unit u */
function recentOcc(exId, group, occ, n, u) {

}
/* What to suggest next time: { mode: 'bump' | 'step' | 'deload' | 'hold', delta, factor, msg } */
function progPlan(it, kind, u, occ) {

  if (!top || kind === 'bodyweight') return { mode: 'hold' };
  const h = recentOcc(it.ex, it.group || '', occ, 3, u); if (!h.length) return { mode: 'hold' };
  const e1 = h[0], e0 = h[1];

/* ---- Storage: a second copy in IndexedDB ----
   Every save still goes to localStorage (as before), and also to IndexedDB, which holds far more. Each save is stamped
   (at), and launch loads whichever copy is newer, so the app survives a full or cleared localStorage. If localStorage is
   full, saves continue in IndexedDB and "Storage is full" only shows when both fail. If IndexedDB can't be read at launch
   while it holds the newer copy, the app refuses to save rather than write an older copy over it. */
const IDB = { ok: typeof indexedDB !== 'undefined', db: null, pending: null, busy: false, savedAt: 0, failed: false };

function idbOpen() {

  return new Promise((res, rej) => { let q; try { q = indexedDB.open('ironwood', 1); } catch (e) { rej(e); return; }
    q.onupgradeneeded = () => { try { q.result.createObjectStore('kv'); } catch (e) {} };
    q.onsuccess = () => { IDB.db = q.result; IDB.db.onversionchange = () => { try { IDB.db.close(); } catch (e) {} IDB.db = null; }; res(IDB.db); };
    q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blocked')); });
}
function idbGet() { return idbOpen().then(db => new Promise((res, rej) => { const r = db.transaction('kv', 'readonly').objectStore('kv').get('main'); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); })); }
function idbPut(raw, at) { return idbOpen().then(db => new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put({ raw, at }, 'main'); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); })); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
function idbQueue(raw, at) {
  if (!IDB.ok) return; IDB.pending = { raw, at }; if (IDB.busy) return;
  const next = () => { const job = IDB.pending; if (!job) { IDB.busy = false; return; } IDB.pending = null; IDB.busy = true;
    idbPut(job.raw, job.at).then(() => { IDB.savedAt = job.at; IDB.failed = false;
      if (lsOver) { try { localStorage.setItem(LS + '.at', String(job.at)); } catch (e) { try { localStorage.removeItem(LS); localStorage.setItem(LS + '.at', String(job.at)); } catch (e2) {} } }
      if (S.sync === 'full' && lsOver) { S.sync = col ? 'pending' : 'local'; S.rerender(); } next(); })
    .catch(() => { IDB.failed = true; if (lsOver) storeFull(); next(); }); };
  next();
}
function storeFull() { if (!lsFull) { lsFull = true; showToast({ kind: 'bad', text: 'Storage is full. Your changes aren’t being saved. Save a backup file now.', ms: 9000 }); } S.sync = 'full'; S.rerender(); }
function storeSave() {
  if (lsBroken || storeBlocked) return false;
  storeAt = Math.max(Date.now(), storeAt + 1);
  const raw = JSON.stringify({ schema: SCHEMA, at: storeAt, meta: S.meta, sessions: S.sessions, active: S.active, activeAt: S.activeAt, dirty: [...S.dirty], rest: S.rest || null, itimer: S.itimer || null });
  idbQueue(raw, storeAt);
  try {
    localStorage.setItem(LS, raw); lsOver = false;
    try { localStorage.setItem(LS + '.at', String(storeAt)); } catch (e) {}
    if (lsFull) { lsFull = false; if (S.sync === 'full') S.sync = col ? 'pending' : 'local'; }
    return true;
  } catch (e) {
    lsOver = true; try { localStorage.setItem(LS + '.at', String(storeAt)); } catch (e2) {}
    if (!IDB.ok || IDB.failed) { storeFull(); return false; }
    return true;

}
async function storeLoad() {
  const ls = lsLoad(); if (!IDB.ok) return ls;
  let rec = null, err = false;
  try { rec = await withTimeout(idbGet(), 3000); } catch (e) { err = true; }
  const lsAt = ls ? (+ls.at || 0) : -1; let mark = 0; try { mark = +localStorage.getItem(LS + '.at') || 0; } catch (e) {}
  if (rec && rec.raw) { let v = null; try { v = JSON.parse(rec.raw); } catch (e) {}

  if (err && mark > Math.max(0, lsAt)) storeBlocked = true;

}
function StoreBlockedScreen() {

/* ============ Barcode scan and online food lookup (Oct 27) ============ */
/* Log food → Scan. Scanning a barcode first checks your own foods, so anything scanned before works offline. Online
   lookups are opt-in (ML().lookup): only the barcode number, or the words you search, go to Open Food Facts, a free
   public food database. A product you log is saved on this phone as one of your foods (with its barcode), so you can
   fix its numbers and the next scan finds it without the internet. */
const OFF_API = 'https://world.openfoodfacts.org';
const OFF_FIELDS = 'code,product_name,brands,serving_size,serving_quantity,nutriments';
const BC_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
/* UPC-A (12 digits) is EAN-13 with a leading 0 */
const bcKey = s => { const d = String(s || '').replace(/\D/g, ''); return d.length === 12 ? '0' + d : d; };
const bcValid = s => { const d = String(s || '').replace(/\D/g, ''); return d.length >= 8 && d.length <= 14; };
const myFoodByBarcode = code => { const k = bcKey(code); return Object.values(ML().foods).find(f => f && f.bc && bcKey(f.bc) === k) || null; };
const lookupOn = () => ML().lookup === true;
const setLookup = on => mealCommit(m => { m.lookup = !!on; });

/* fetch JSON with a time limit; throws 'offline' or 'error' */
async function offGet(path, ms = 9000) {
  if (navigator.onLine === false) throw new Error('offline');
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), ms);
  try {
    const r = await fetch(OFF_API + path, { signal: ctl ? ctl.signal : undefined, headers: { Accept: 'application/json' } });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('error');
    return await r.json();
  } catch (e) { throw new Error(e && e.message === 'error' ? 'error' : navigator.onLine === false ? 'offline' : 'error'); }
  finally { clearTimeout(t); }
}
/* An Open Food Facts product → { code, name, brand, per (per 100 g), sq (grams a serving), svTxt }, or null with no calories */
function offProduct(p) {
  if (!p) return null; const n = p.nutriments || {};
  const v = k => { const x = n[k + '_100g']; return x === '' || x == null || !isFinite(+x) ? null : +x; };
  let kcal = v('energy-kcal'); if (kcal == null && v('energy') != null) kcal = v('energy') / 4.184;
  const name = String(p.product_name || '').trim(); const brand = String(p.brands || '').split(',')[0].trim();
  const per = { kcal, p: v('proteins'), c: v('carbohydrates'), f: v('fat'), fib: v('fiber'), sug: v('sugars'), na: v('sodium') != null ? v('sodium') * 1000 : v('salt') != null ? v('salt') * 400 : null };
  const sq = +p.serving_quantity > 0 && +p.serving_quantity < 2000 ? +p.serving_quantity : null;
  return { code: String(p.code || ''), name: name || brand || 'Scanned food', brand: name ? brand : '', per, sq, svTxt: String(p.serving_size || '').trim(), ok: kcal != null };
}
async function lookupBarcode(code) {
  const c = String(code).replace(/\D/g, ''); const tries = c.length === 12 ? [c, '0' + c] : c.length === 13 && c[0] === '0' ? [c, c.slice(1)] : [c];
  for (const t of tries) { const j = await offGet('/api/v2/product/' + t + '.json?fields=' + OFF_FIELDS); if (j && j.status !== 0 && j.product) return offProduct({ code: c, ...j.product, code: c }); }

}
async function searchFoodsOnline(q) {
  const j = await offGet('/cgi/search.pl?search_terms=' + encodeURIComponent(q) + '&search_simple=1&action=process&json=1&page_size=20&fields=' + OFF_FIELDS, 12000);
  return ((j && j.products) || []).map(offProduct).filter(p => p && p.ok && p.code);
}
/* Save a product as one of your foods (label numbers per serving), or update the one with the same barcode */
function saveScanned(p) {
  const old = p.code ? myFoodByBarcode(p.code) : null; const fid = old ? old.id : uid('my-');
  const gr = p.sq || 100; const r1 = x => Math.round(x * 10) / 10;
  const lab = Object.fromEntries(NUT.filter(([k]) => p.per[k] != null).map(([k]) => [k, k === 'na' ? Math.round(p.per[k] * gr / 100) : r1(p.per[k] * gr / 100)]));
  const name = (p.brand ? p.brand + ' ' : '') + p.name;
  mealCommit(m => { m.foods[fid] = { ...(old || {}), id: fid, name: old ? old.name : name, sv: old ? old.sv : p.sq ? { q: 1, u: 'serving', gr } : { q: 100, u: 'g', gr: 100 }, ...(p.svTxt && !old ? { svTxt: p.svTxt } : {}), lab: old ? old.lab : lab, bc: p.code || (old && old.bc), src: old ? old.src : 'off', updatedAt: Date.now() }; });

}
/* A saved food as a product card */
function productOfFood(f) {
  const gr = +f.sv.gr; const per = Object.fromEntries(NUT.map(([k]) => [k, f.lab && f.lab[k] != null ? f.lab[k] / gr * 100 : null]));
  const wt = f.sv.u === 'g' || f.sv.u === 'oz';
  return { code: f.bc || '', name: f.name, brand: '', per, sq: wt ? null : gr / (+f.sv.q || 1), svTxt: f.svTxt || (wt ? '' : fracStr(+f.sv.q || 1) + ' ' + f.sv.u + ' (' + Math.round(gr) + ' g)'), ok: true, fid: f.id, own: true };

/* The barcode reader: the phone's own when it has one (Chrome, Android), else ZXing in WebAssembly (iPhone), loaded
   from this site the first time you scan and kept for offline use. */
let _bdP = null;
function barcodeReader() {
  if (_bdP) return _bdP;
  _bdP = (async () => {
    if ('BarcodeDetector' in window) {
      try { const have = await window.BarcodeDetector.getSupportedFormats(); const f = BC_FORMATS.filter(x => have.includes(x)); if (f.length) return new window.BarcodeDetector({ formats: f }); } catch (e) {}
    }
    if (!window.BarcodeDetectionAPI) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/barcode-ponyfill.js'; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
    const A = window.BarcodeDetectionAPI; if (!A || !A.BarcodeDetector) throw new Error('load');
    A.prepareZXingModule({ overrides: { locateFile: (path, prefix) => path.endsWith('.wasm') ? 'vendor/' + path : prefix + path } });
    return new A.BarcodeDetector({ formats: BC_FORMATS });
  })();
  _bdP.catch(() => { _bdP = null; });

function BarcodeCam({ onCode, onClose }) {
  const vid = useRef(null); const [msg, setMsg] = useState('Starting the camera…');
  useEffect(() => {
    let stream = null, stop = false, timer = 0;
    (async () => {
      const md = navigator.mediaDevices;
      if (!md || !md.getUserMedia) { setMsg('This phone can’t open the camera here. Type the number under the barcode instead.'); return; }
      try { stream = await md.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
      catch (e) { setMsg(e && e.name === 'NotAllowedError' ? 'Camera access is off for Ironwood. Allow it in Settings, or type the number under the barcode.' : 'The camera didn’t start. Type the number under the barcode instead.'); return; }
      if (stop) { stream.getTracks().forEach(t => t.stop()); return; }
      const v = vid.current; v.srcObject = stream; try { await v.play(); } catch (e) {}
      let det; try { det = await barcodeReader(); } catch (e) { setMsg('The barcode reader didn’t load. Type the number under the barcode instead.'); return; }
      setMsg('Point at the barcode and hold steady.');
      const tick = async () => {
        if (stop) return;
        try { if (v.readyState >= 2) { const hits = await det.detect(v); const h = hits && hits.find(x => bcValid(x.rawValue)); if (h && !stop) { stop = true; try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} onCode(h.rawValue.replace(/\D/g, '')); return; } } } catch (e) {}
        timer = setTimeout(tick, 220);
      };
      tick();
    })();
    return () => { stop = true; clearTimeout(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, []);
  return html`<div class="bc-cam" id="bc-cam"><video ref=${vid} playsinline muted autoplay aria-label="Camera"></video><div class="bc-aim" aria-hidden="true"></div>
    <p class="small muted" role="status" style="margin-top:8px">${msg}</p><button class="btn wide" style="margin-top:8px" onClick=${onClose}>Close camera</button></div>`;
}

      <div class="row" style="margin-top:10px;gap:8px"><button class="btn primary" style="flex:1" id="lookup-allow" onClick=${() => setLookup(true)}>Allow lookups</button><button class="btn" style="flex:1" id="lookup-no" onClick=${() => setLookup(false)}>Not now</button></div></div>` : null}

    ${miss ? html`<div class="card" id="bc-miss"><div style="font-weight:700">${lookupOn() ? 'Not in the food database' : 'Not one of your foods yet'}</div>

      <div class="row wrap" style="margin-top:10px;gap:8px">${!lookupOn() ? html`<button class="btn primary" style="flex:1" id="bc-allow" onClick=${allow}>Look it up online</button>` : null}<button class="btn" style="flex:1" id="bc-label" onClick=${() => addLabel(miss)}>Add from the label</button></div></div>` : null}

/* One product: choose the amount, see the numbers, log it */

  };
  const missing = NUT.filter(([k]) => p.per[k] == null).map(([, l]) => l.toLowerCase());
  return html`<div class="stack" id="scan-product">
    <div class="row"><div style="flex:1;min-width:0"><div style="font-weight:700">${p.name}</div><div class="small muted">${[p.brand, p.svTxt ? 'Serving ' + p.svTxt : p.sq ? 'Serving ' + p.sq + ' g' : '', p.own ? 'Saved on this phone' : 'From Open Food Facts'].filter(Boolean).join(' · ')}</div></div><button class="btn text" onClick=${onBack}>Back</button></div>
    ${p.sq ? html`<div class="seg wide" role="group" aria-label="Amount in">${[['sv', 'Servings'], ['g', 'Grams']].map(([k, l]) => html`<button key=${k} class=${unit === k ? 'on' : ''} aria-pressed=${unit === k} onClick=${() => setUnit(k)}>${l}</button>`)}</div>` : null}
    ${unit === 'sv' ? html`<div class="row"><span style="flex:1;font-weight:600">Servings</span><${MStep} label="servings eaten" value=${sv} min=${0.5} max=${10} step=${0.5} onChange=${setSv}/></div>`

    <${MacroTiles} m=${m}/><${ExtraLine} m=${m}/>
    ${missing.length ? html`<p class="small muted">No ${missing.join(', ')} listed for this product, so ${missing.length > 1 ? 'they count' : 'it counts'} as 0.</p>` : null}
    <button class="btn primary wide" id="scan-log" disabled=${!(grams > 0)} onClick=${save}>Log it</button>
    ${!p.own ? html`<p class="small faint">Logging saves it to your foods with its barcode, so the next scan works offline. You can fix its numbers in Meals → Recipes → My foods.</p>` : html`<button class="btn text" style="align-self:flex-start" onClick=${() => openSheet({ type: 'foodEdit', id: p.fid })}>Fix the numbers</button>`}</div>`;
}

/* ============ Last time's numbers, rep records (Oct 27) ============ */
/* Where a workout's prefilled weights and reps (and the weight-jump suggestions) come from:
   'all'     – the last time you did the exercise in any workout (the default)
   'workout' – the last time you did it in this same workout (plan day); if never, any workout.
   settings.prefill is the default; settings.prefillBy[routineId] overrides it for one plan. Records and PRs always
   count every workout. */
let PREFILL_CTX = null;
const PREFILL_OPTS = [['all', 'Any workout'], ['workout', 'This workout only']];
const prefillScopeFor = rid => { const st = S.meta.settings; const o = rid && st.prefillBy && st.prefillBy[rid]; return o || st.prefill || 'all'; };
function prefillCtx() {
  const a = S.active; const c = a ? { rid: a.routineId, did: a.dayId } : PREFILL_CTX;
  return c && c.rid && c.did && prefillScopeFor(c.rid) === 'workout' ? c : null;
}
const sameWorkout = (s, c) => s.routineId === c.rid && s.dayId === c.did;
function lastEntryOccIn(exId, group, occ, keep) {
  const list = sessionList();
  for (let i = list.length - 1; i >= 0; i--) {
    const x = list[i]; if (!keep(x)) continue; const its = x.items.filter(it => it.ex === exId && (it.group || '') === group);
    if (its.length) { const it = its[Math.min(occ || 0, its.length - 1)]; return { t: x.startedAt, sid: x.id, group, sets: toMain(it.sets, it.u), raw: it.sets, u: it.u || U(), note: it.note || '' }; }
  }
  return null;
}
function setPrefill(v, rid) {
  commit(st => {
    const s = st.meta.settings;
    if (!rid) { s.prefill = v; return; }
    s.prefillBy = { ...(s.prefillBy || {}) }; if (v === (s.prefill || 'all')) delete s.prefillBy[rid]; else s.prefillBy[rid] = v;
  }, 'meta', 400);
}
function PrefillSeg({ rid }) {
  const cur = prefillScopeFor(rid);
  return html`<div class="seg" role="group" aria-label="Last time's numbers come from" id=${rid ? 'prefill-plan' : 'prefill-all'}>${PREFILL_OPTS.map(([k, l]) => html`<button key=${k} class=${cur === k ? 'on' : ''} aria-pressed=${cur === k} id=${(rid ? 'pfp-' : 'pf-') + k} onClick=${() => setPrefill(k, rid)}>${l}</button>`)}</div>`;
}
/* Plan page: per-plan choice */
function PrefillRow({ r }) {
  if (r.info && (r.info.care || r.info.fight)) return null;
  const over = (S.meta.settings.prefillBy || {})[r.id];
  return html`<div class="card" style="margin-top:12px" id="prefill-row"><div style="font-weight:600">Last time’s numbers come from</div>
    <p class="small muted" style="margin:2px 0 8px">${r.days.length > 1 ? 'Any workout, or only the last time you did this day of the plan.' : 'Any workout, or only the last time you did this routine.'} ${over ? 'Set for this plan.' : 'Same as your default in Profile.'}</p>
    <${PrefillSeg} rid=${r.id}/></div>`;
}

/* Exercise stats: the most reps at each weight. A row shows only when nothing heavier was ever done for as many reps,
   so the list starts at your heaviest weight and works down. Weights logged in the other unit are converted. */
function repRecords(ex, group) {
  const best = new Map();
  for (const e of entries(ex, group)) for (const x of e.sets) {
    const w = r05(+x.w || 0), r = +x.r || 0; if (!(w > 0) || !(r > 0)) continue;
    const b = best.get(w); if (!b || r > b.r || (r === b.r && e.t < b.t)) best.set(w, { w, r, t: e.t });
  }
  const out = []; let most = 0;
  for (const b of [...best.values()].sort((a, c) => c.w - a.w)) if (b.r > most) { out.push(b); most = b.r; }
  return out;
}
function RepRecords({ ex, group }) {
  const k = exKind(ex); if (k === 'assisted' || k === 'bodyweight' || isMeasured(k)) return null;
  const rows = repRecords(ex, group); if (!rows.length) return null;
  return html`<div class="section-h"><h2>Best reps at each weight</h2></div>
    <div class="card prl" id="rep-records">${rows.map((b, i) => html`<div key=${b.w}><div><div style="font-weight:600">${fmt(b.w)} ${U()}${i === 0 ? html` <span class="chip on" style="margin-left:4px">Heaviest</span>` : null}</div><div class="small muted">${shortDate(b.t)}</div></div><b class="num">${b.r} rep${b.r === 1 ? '' : 's'}</b></div>`)}
      <p class="small muted" style="margin-top:6px">A weight shows only when nothing heavier was done for as many reps. Sets logged in ${U() === 'kg' ? 'lb' : 'kg'} are converted to ${U()}.</p></div>`;
}
/* One set's numbers from last time, shown beside the set */
function prevSetText(it, j, kind) {
  const p = it.prev && it.prev[j]; if (!p || !(+p.r > 0)) return '';
  return kind === 'bodyweight' && !(+p.w) ? p.r + ' reps' : fmt(+p.w || 0) + ' × ' + p.r;
}

  if (tab === 'train' && vt === 'fight') title = 'Fight coach';
  if (tab === 'train' && vt === 'challenge') title = 'Challenge';

/* Save whatever is in storage as a file (or to the clipboard), even when the app itself can't run */
async function saveRawData(raw, name) {
  const C = window.claude; let dl = null; try { dl = C && C.use ? await C.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: raw }); return 'Saved.'; } catch (e) { if (e && e.code === 'declined') return 'Not saved.'; } }
  try { await navigator.clipboard.writeText(raw); return 'Copied to the clipboard. Paste it into a note to keep it.'; } catch (e) { return 'Couldn’t save or copy here.'; }
}
/* Shown instead of the app when the saved data can't be read. Nothing is written until the person decides. */
function RecoveryScreen() {
  const [msg, setMsg] = useState(''); const [sure, setSure] = useState(false);
  const save = async () => setMsg(await saveRawData(lsBroken, 'ironwood-data-' + ymd(new Date()) + '.txt'));
  const fresh = () => { try { localStorage.removeItem(LS); } catch (e) {} lsBroken = null; location.reload(); };
  return html`<main><div class="card stack" style="margin-top:24px">
    <h2>Saved data couldn’t be read</h2>
    <p class="note">The workouts saved on this device are there but damaged, so the app can’t open them. Nothing new will be saved until this is sorted out. A copy has been kept.</p>
    <p class="note">Save the raw data first, then start fresh and restore your latest backup.</p>
    <button class="btn primary wide" onClick=${save}>Save raw data</button>
    ${msg ? html`<p class="small muted" role="status">${msg}</p>` : null}
    ${sure ? html`<button class="btn danger wide" onClick=${fresh}>Yes, start fresh</button>` : html`<button class="btn wide" onClick=${() => setSure(true)}>Start fresh…</button>`}
    <button class="btn text wide" onClick=${() => location.reload()}>Try again</button>
  </div></main>`;
}
/* A render error used to leave a blank page. Now it shows what went wrong, with a way to get the data out. */
class Guard extends htmPreact.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  componentDidCatch(err) { try { if (typeof ERRS !== 'undefined') { ERRS.push(String(err && err.message || err).slice(0, 200)); if (ERRS.length > 5) ERRS.shift(); } } catch (e) {} this.setState({ err }); }
  render() { return this.state.err ? html`<${CrashScreen} err=${this.state.err} retry=${() => this.setState({ err: null })}/>` : this.props.children; }
}
function CrashScreen({ err, retry }) {
  const [msg, setMsg] = useState('');
  const save = async () => { let raw = ''; try { raw = localStorage.getItem(LS) || ''; } catch (e) {} setMsg(raw ? await saveRawData(raw, 'ironwood-backup-' + ymd(new Date()) + '.json') : 'Nothing is saved on this device yet.'); };
  return html`<main><div class="card stack" style="margin-top:24px">
    <h2>Something went wrong</h2>
    <p class="note">The app hit an error it couldn’t recover from. Your saved workouts are still on this device.</p>
    <p class="small muted" style="word-break:break-word">${String(err && err.message || err).slice(0, 300)}</p>
    <button class="btn primary wide" onClick=${retry}>Try again</button>
    <button class="btn wide" onClick=${save}>Save backup file</button>
    ${msg ? html`<p class="small muted" role="status">${msg}</p>` : null}
    <button class="btn text wide" onClick=${() => location.reload()}>Reload the app</button>
  </div></main>`;
}
(async function boot() {
  const l = migrateData(await storeLoad());
  if (l) { S.meta = normalizeMeta(l.meta);
    if (l.rest && typeof l.rest === 'object' && +l.rest.until > Date.now()) S.rest = l.rest;
    if (l.itimer && typeof l.itimer === 'object' && l.itimer.cfg && Array.isArray(l.itimer.phases)) S.itimer = l.itimer; S.sessions = cleanSessions(l.sessions).sessions; S.active = l.active && typeof l.active === 'object' ? l.active : null; S.activeAt = l.activeAt || 0; S.dirty = new Set(Array.isArray(l.dirty) ? l.dirty : []); }
  if (window.claude && window.claude.standalone) S.dirty = new Set();

  if (storeBlocked) { render(html`<${StoreBlockedScreen}/>`, document.getElementById('app')); return; }
  render(html`<${Guard}><${App}/><//>`, document.getElementById('app'));
  setInterval(audioTick, 200);
  setTimeout(l10nStart, 0);
  initCloud();
  setTimeout(() => { if (lsGet('tourDone') !== '1' && !S.active && !Object.keys(S.sessions).length) startTour(); }, 1400);
})();
</script>

});
